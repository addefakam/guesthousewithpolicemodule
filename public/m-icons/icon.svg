    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- House body -->
  <path d="M256 120 L400 248 L400 400 C400 412 390 420 380 420 L132 420 C122 420 112 412 112 400 L112 248 Z" fill="white" opacity="0.95"/>
  <!-- Roof -->
