  <line x1="174" y1="240" x2="174" y2="288" stroke="#059669" stroke-width="2" opacity="0.3"/>
  <line x1="148" y1="264" x2="200" y2="264" stroke="#059669" stroke-width="2" opacity="0.3"/>
  <line x1="338" y1="240" x2="338" y2="288" stroke="#059669" stroke-width="2" opacity="0.3"/>
  <line x1="312" y1="264" x2="364" y2="264" stroke="#059669" stroke-width="2" opacity="0.3"/>
